name: Desktop promote

# Move uma versao ja compilada entre os tres estados de distribuicao:
#
#   target: beta    -> publica como pre-release: so as balancas marcadas TESTE
#   target: latest  -> publica como estavel: TODAS as balancas de producao
#   target: parar   -> volta para rascunho: ninguem mais recebe
#
# Este workflow NAO compila nada e NAO mexe em assets. O `desktop-release.yml`
# deixa o instalador definitivo, o `.blockmap` e o `latest.yml` anexados a um
# RASCUNHO. Promover e so trocar as flags `draft`/`prerelease` da release.
#
# O `.exe` nao se move, nao e regerado e nao muda de conteudo: a balanca recebe
# exatamente o binario que rodou no teste. Recompilar produziria outro numero de
# versao (a versao e `MAJOR.MINOR.<run_number>`) e um binario que ninguem testou,
# que e justamente o que este fluxo existe para evitar.
#
# ## Por que draft/prerelease, e nao um metadado por anel
#
# A primeira versao deste fluxo publicava `beta.yml` para o anel de teste e
# `latest.yml` para producao, com o desktop escolhendo via `autoUpdater.channel`.
# Nao funcionava. O KyberRock publica em repositorio PRIVADO, e nesse caminho o
# `electron-updater` usa o `PrivateGitHubProvider`, que resolve o metadado por
# `getDefaultChannelName()` — fixo em "latest", nunca lendo `updater.channel`.
# O `beta.yml` era um arquivo que maquina nenhuma abria: a balanca de teste
# ficava sem receber nada e so via a versao quando ela ia para producao.
#
# O unico ajuste que aquele provider respeita e `allowPrerelease`, e e sobre ele
# que os aneis se apoiam agora:
#
#   allowPrerelease=false (producao) -> GET /releases/latest, que pula rascunho
#                                       E pre-release
#   allowPrerelease=true  (teste)    -> GET /releases, descarta rascunho e
#                                       prefere a pre-release mais nova
#
# Consequencia que vale ter em mente ao mexer aqui: uma release publicada como
# pre-release SEM `latest.yml` dentro derruba o anel de teste inteiro — ela vira
# a candidata mais nova e o updater erra com ERR_UPDATER_CHANNEL_FILE_NOT_FOUND
# em vez de cair para a anterior. Por isso a guarda do `latest.yml` abaixo vale
# para os dois aneis, e por isso `parar` existe: e o unico jeito de tirar do ar
# uma pre-release que nao deveria estar publicada.
#
# Tres builds seguidos sem promocao ficam parados. Ao liberar so o ultimo, a
# balanca da UM salto — nao instala tres vezes.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao a promover, sem o 'v' (ex.: 0.8.150)"
        required: true
        type: string
      target:
        description: "Destino: beta (balancas de teste), latest (todas) ou parar (volta a rascunho)"
        required: true
        type: choice
        options:
          - beta
          - latest
          - parar
        default: beta
      force:
        description: "Promover mesmo com aviso (versao mais antiga que a atual, ou producao sem passar pelo teste)"
        required: false
        type: boolean
        default: false

concurrency:
  group: desktop-promote
  cancel-in-progress: false

permissions:
  contents: write # publicar/despublicar a release

jobs:
  promote:
    name: Move a build between distribution rings
    runs-on: ubuntu-latest
    steps:
      - name: Promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          VERSION="${VERSION#v}"   # aceita tanto "0.8.150" quanto "v0.8.150"
          TAG="v$VERSION"
          API="https://api.github.com/repos/$REPO"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")
          JSON=(-H "Accept: application/vnd.github+json")

          echo "Movendo $TAG para o estado '$TARGET'."

          # ---------------------------------------------------------------
          # 1. A release existe?
          #
          # Busca na LISTAGEM, e nao em `/releases/tags/$TAG`: um build parado e
          # rascunho, e rascunho nao tem tag no git — a busca por tag devolveria
          # 404 justamente para o caso mais comum (promover um build novo).
          # ---------------------------------------------------------------
          releases=$(curl -sS -f "${AUTH[@]}" "${JSON[@]}" "$API/releases?per_page=100")
          release=$(echo "$releases" | jq -c --arg t "$TAG" 'map(select(.tag_name == $t)) | first // empty')

          if [ -z "$release" ]; then
            echo "::error title=Release nao encontrada::Nao existe release com a tag $TAG entre as 100 mais recentes. Confira a versao na aba Releases."
            exit 1
          fi

          release_id=$(echo "$release" | jq -r '.id')
          is_draft=$(echo "$release" | jq -r '.draft')
          is_prerelease=$(echo "$release" | jq -r '.prerelease')
          echo "Release $TAG encontrada (id=$release_id draft=$is_draft prerelease=$is_prerelease)."

          asset_id() { echo "$release" | jq -r --arg n "$1" '.assets[] | select(.name == $n) | .id'; }

          # ---------------------------------------------------------------
          # 2. A release esta completa?
          #
          # Vale para os tres alvos, inclusive `parar`: se algo aqui estiver
          # errado, e melhor saber agora do que depois de publicar.
          # ---------------------------------------------------------------
          metadata_id=$(asset_id latest.yml)
          if [ -z "$metadata_id" ]; then
            echo "::error title=Release sem metadados::A release $TAG nao tem latest.yml. Sem ele o updater acha a release e nao acha o metadado — ficaria cego em silencio. O build nao foi publicado por completo."
            echo "Assets presentes:"
            echo "$release" | jq -r '.assets[].name'
            exit 1
          fi

          curl -sS -f "${AUTH[@]}" -H "Accept: application/octet-stream" \
            -L "$API/releases/assets/$metadata_id" -o metadata.yml

          yml_version=$(grep -m1 '^version:' metadata.yml | sed 's/^version:[[:space:]]*//' | tr -d '\r')
          yml_path=$(grep -m1 '^path:' metadata.yml | sed 's/^path:[[:space:]]*//' | tr -d '\r')
          echo "Metadados: versao=$yml_version arquivo=$yml_path"

          if [ "$yml_version" != "$VERSION" ]; then
            echo "::error title=Versao divergente::O metadado da release $TAG diz versao '$yml_version'. Promocao abortada para nao publicar metadado errado."
            exit 1
          fi

          exe_name="${yml_path// /-}"
          if [ -z "$(asset_id "$exe_name")" ]; then
            echo "::error title=Instalador ausente::O metadado aponta para '$exe_name', que nao esta anexado a release $TAG."
            echo "Assets presentes:"
            echo "$release" | jq -r '.assets[].name'
            exit 1
          fi
          echo "OK: instalador '$exe_name' presente na release."

          # Producao de hoje, para as guardas de regressao. Uma release ainda em
          # rascunho ou pre-release nunca aparece aqui.
          current=$(curl -sS "${AUTH[@]}" "${JSON[@]}" "$API/releases/latest" | jq -r '.tag_name // empty')
          current="${current#v}"
          echo "Producao hoje: ${current:-<nenhuma>}"

          # ---------------------------------------------------------------
          # 3. Guardas. Avisam alto e so passam com 'force'.
          # ---------------------------------------------------------------
          if [ "$TARGET" = "latest" ]; then
            # 3a. Nao pular o anel de teste sem querer.
            if [ "$is_prerelease" != "true" ] || [ "$is_draft" = "true" ]; then
              if [ "$FORCE" != "true" ]; then
                echo "::error title=Versao nao testada::$VERSION nunca foi publicada no anel de teste (ainda esta como rascunho). Mande para 'beta' primeiro, ou marque 'force' se for um hotfix consciente."
                exit 1
              fi
              echo "::warning title=Producao sem teste::$VERSION vai direto para producao sem passar pelo beta, porque 'force' foi marcado."
            fi

            # 3b. Nao regredir a frota sem querer.
            if [ -n "$current" ]; then
              lowest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | head -n1)
              if [ "$VERSION" != "$current" ] && [ "$lowest" = "$VERSION" ]; then
                if [ "$FORCE" != "true" ]; then
                  echo "::error title=Versao mais antiga::$VERSION e anterior a producao atual ($current). As balancas nao fazem downgrade sozinhas, entao isso deixaria a frota parada onde esta. Marque 'force' se for mesmo o que voce quer."
                  exit 1
                fi
                echo "::warning title=Promocao regressiva::$VERSION e anterior a $current, seguindo porque 'force' foi marcado."
              fi
            else
              echo "Nenhuma release de producao ainda — esta sera a primeira."
            fi
          fi

          if [ "$TARGET" = "parar" ] && [ "$VERSION" = "$current" ]; then
            # Despublicar a producao atual faz a frota inteira cair para a versao
            # estavel anterior — como as balancas nao fazem downgrade sozinhas,
            # na pratica elas ficam paradas onde estao e param de receber.
            if [ "$FORCE" != "true" ]; then
              echo "::error title=E a producao atual::$VERSION e a versao que a frota esta recebendo. Tirar do ar deixaria as balancas sem canal de atualizacao. Libere outra versao para producao antes, ou marque 'force'."
              exit 1
            fi
            echo "::warning title=Producao despublicada::$VERSION era a producao atual e esta saindo do ar porque 'force' foi marcado."
          fi

          # ---------------------------------------------------------------
          # 4. Trocar o estado. Idempotente: repetir o mesmo alvo nao muda nada.
          #
          # Publicar um rascunho tambem cria a tag `$TAG` no commit gravado em
          # `target_commitish` quando o build rodou.
          # ---------------------------------------------------------------
          case "$TARGET" in
            beta)   payload='{"draft":false,"prerelease":true}' ;;
            latest) payload='{"draft":false,"prerelease":false,"make_latest":"true"}' ;;
            parar)  payload='{"draft":true}' ;;
            *)      echo "::error title=Alvo desconhecido::'$TARGET' nao e um destino valido."; exit 1 ;;
          esac

          curl -sS -f -X PATCH "${AUTH[@]}" "${JSON[@]}" \
            "$API/releases/$release_id" -d "$payload" > /dev/null
          echo "Release $TAG agora esta em '$TARGET'."

          # ---------------------------------------------------------------
          # 5. Resumo.
          # ---------------------------------------------------------------
          {
            echo "## $VERSION → \`$TARGET\`"
            echo ""
            echo "- Instalador: \`$exe_name\` (o mesmo do build, nao foi recompilado)"
            case "$TARGET" in
              latest)
                echo "- Producao anterior: ${current:-<nenhuma>}"
                echo "- Release publicada como **estavel**: todas as balancas de producao passam a receber na proxima verificacao (a cada 30 min) e instalam quando o operador fechar o app."
                ;;
              beta)
                echo "- Release publicada como **pre-release**: so as balancas marcadas como teste enxergam."
                echo "- Aprovado? Rode este workflow de novo com \`target: latest\`."
                ;;
              parar)
                echo "- Release voltou para **rascunho**: nao alcanca mais nenhuma balanca."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
