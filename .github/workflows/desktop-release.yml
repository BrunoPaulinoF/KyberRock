name: Desktop release

# Gera o instalador Windows do KyberRock Desktop e o deixa PARADO no GitHub
# Releases, como pre-release, com um metadado de nome NEUTRO (`build.yml`).
#
# Nenhuma balanca segue `build.yml` — nem as de producao (canal `latest`), nem a
# de teste (canal `beta`). Compilar deixou de ser sinonimo de distribuir: quem
# move uma versao para teste ou para producao e o workflow `desktop-promote.yml`,
# sempre por acao explicita.
#
# Antes desta mudanca, todo merge na `main` que tocasse o desktop virava
# atualizacao automatica em TODAS as pedreiras em questao de minutos, sem release
# de teste, sem rollout parcial e sem como desfazer. Efeito colateral bom do novo
# modelo: tres merges seguidos geram tres builds parados; ao liberar so o ultimo,
# a balanca da um salto unico em vez de instalar tres vezes.
#
# Fluxo:
#   1. push na main (tocando o desktop) ou disparo manual;
#   2. a versao vira MAJOR.MINOR.<run_number> (sempre crescente, sem bump manual);
#   3. o token de LEITURA (secret GH_UPDATER_TOKEN) e injetado no app;
#   4. build do instalador NSIS + latest.yml + .blockmap (sem publicar);
#   5. confere que o binario nativo entrou no pacote — ANTES de subir qualquer
#      asset, para nunca publicar um instalador que nao abriria;
#   6. sobe .exe + .blockmap + o yml renomeado para `build.yml` na release
#      `vX.Y.Z`, marcada como pre-release.
#
# Por que o yml e RENOMEADO no upload em vez de o electron-builder gera-lo com
# outro nome: passar o canal para o electron-builder tambem grava `channel: ...`
# no `app-update.yml` embutido no app. O binario promovido continuaria procurando
# aquele nome pelo resto da vida — a primeira promocao quebraria o auto-update de
# toda a frota. Gerando sempre `latest.yml` e renomeando so o ASSET, o app fica
# com o canal padrao e quem escolhe o canal e o proprio desktop, em execucao.

on:
  # Push na main que toca o desktop (ou suas dependencias) gera uma versao nova
  # e publica. O filtro de paths evita gastar minutos pagos do Actions (runner
  # Windows custa 2x em repo privado) com merges que nao mudam o instalador
  # (ex.: so edge functions em supabase/ ou docs/).
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "functions/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo do build manual (opcional)"
        required: false
        default: ""

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write # necessario para criar o GitHub Release e subir os assets

jobs:
  release:
    name: Build and publish Windows installer
    env:
      # Nome do asset de metadados que este workflow publica. NEUTRO de proposito:
      # nenhum canal de atualizacao aponta para ele, entao um build recem-saido
      # nao alcanca maquina nenhuma. O `desktop-promote.yml` e quem copia este
      # arquivo para `beta.yml` (teste) ou `latest.yml` (producao).
      BUILD_METADATA_ASSET: build.yml
    # windows-2022 traz o Visual Studio 2022, que o node-gyp reconhece. O
    # windows-latest passou a trazer um VS mais novo (v18) que o node-gyp
    # empacotado nao detecta, quebrando a compilacao nativa do better-sqlite3.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --ignore-scripts evita o postinstall do better-sqlite3 tentar compilar
        # para o runtime de Node. O binario para o Electron e produzido depois
        # pelo rebuild:native:electron (dentro de dist:win:ci).
        run: npm ci --ignore-scripts

      - name: Resolve version (MAJOR.MINOR.run_number)
        id: version
        shell: bash
        # Roda depois do `npm ci` porque o `npm ci` exige que a versao do
        # workspace bata com o package-lock.json. O electron-builder le a versao
        # do package.json no momento do build, entao o bump aqui e suficiente e
        # nao e commitado de volta.
        run: |
          BASE=$(node -p "require('./apps/desktop/package.json').version")
          MAJOR_MINOR=$(echo "$BASE" | cut -d. -f1-2)
          export VERSION="${MAJOR_MINOR}.${GITHUB_RUN_NUMBER}"
          echo "Versao do release: $VERSION (base $BASE)"
          node -e "const f='apps/desktop/package.json';const fs=require('fs');const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version=process.env.VERSION;fs.writeFileSync(f, JSON.stringify(p,null,4)+'\n');"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Inject updater read-token into the app
        shell: bash
        env:
          GH_UPDATER_TOKEN: ${{ secrets.GH_UPDATER_TOKEN }}
        run: |
          if [ -z "${GH_UPDATER_TOKEN:-}" ]; then
            echo "::warning title=Token de update ausente::Secret GH_UPDATER_TOKEN nao configurado. O release sera publicado, mas os apps instalados NAO conseguirao autenticar para baixar a atualizacao (repo privado). Crie um PAT fine-grained (Contents: read neste repo) e salve como GH_UPDATER_TOKEN."
          fi
          node -e "const f='apps/desktop/src/main/updater-config.ts';const fs=require('fs');let s=fs.readFileSync(f,'utf8');s=s.replace(/export const GITHUB_UPDATER_TOKEN = \"\";/, 'export const GITHUB_UPDATER_TOKEN = '+JSON.stringify(process.env.GH_UPDATER_TOKEN||'')+';');fs.writeFileSync(f,s);"

      - name: Build workspaces (packages before desktop)
        # O tsconfig do desktop nao referencia os pacotes @kyberrock/*, entao eles
        # precisam ser compilados antes (dist/*.d.ts). O build da raiz compila
        # todos os workspaces na ordem certa. Sem isto, o tsc do desktop falha com
        # "Cannot find module '@kyberrock/...'".
        run: npm run build

      - name: Create the GitHub release (tag + release) up front
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Criamos a release (e a tag) via API ANTES do build, para que o passo de
        # upload so anexe assets a uma release que ja existe. Passo idempotente.
        # Criar release ja cria a tag; push de tag/release nao dispara o workflow
        # (o gatilho e so branches: [main]).
        #
        # SEMPRE pre-release. E a flag mais importante deste workflow: uma release
        # marcada como nao-prerelease vira "a ultima release" para toda a frota, e
        # esta so tem `build.yml` dentro — as balancas procurariam `latest.yml`,
        # nao achariam, e o auto-update ficaria cego EM SILENCIO. Quem tira o
        # pre-release e o `desktop-promote.yml`, no momento de liberar producao.
        #
        # Efeito colateral bem-vindo: se o build falhar depois deste passo, o que
        # fica para tras e uma release vazia marcada como pre-release, que a frota
        # ignora. Antes ficava uma release estavel vazia, com o mesmo sintoma de
        # updater cego descrito acima.
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          echo "Publicando build parado (pre-release, metadado $BUILD_METADATA_ASSET)."

          existing=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          release_id=$(echo "$existing" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);console.log(r.id||'')})")

          if [ -n "$release_id" ]; then
            echo "Release $TAG ja existe (id=$release_id). Garantindo prerelease=true..."
            curl -s -f -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/releases/$release_id" \
              -d '{"prerelease":true}' > /dev/null
          else
            echo "Criando release $TAG..."
            curl -s -f -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/releases" \
              -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"${{ github.sha }}\",\"name\":\"KyberRock Desktop ${{ steps.version.outputs.version }}\",\"draft\":false,\"prerelease\":true}" \
              > /dev/null
            echo "Release $TAG criada."
          fi

      - name: Build the Windows installer (no publish)
        id: publish
        shell: bash
        # `--publish never`: quem sobe os assets e o passo de upload abaixo, que
        # ja existia como rede de seguranca e agora e o caminho unico. Isso
        # elimina de vez a race conhecida do publisher do electron-builder (ver
        # run 29839470541: publicou o .exe mas abortou com 422 antes do
        # latest.yml/blockmap, deixando o auto-update cego) e e o que permite
        # renomear o yml por canal e conferir o pacote antes de publicar.
        #
        # Sem `continue-on-error`: com o publish fora deste passo, qualquer falha
        # aqui e falha de BUILD, e build quebrado tem que reprovar o run.
        run: npm run dist:win:ci --workspace @kyberrock/desktop

      - name: Verify the native module is inside the package
        shell: bash
        # O app so abre se o better_sqlite3.node (binario nativo compilado para o
        # Electron) estiver empacotado (desempacotado do asar). Falhamos o run se
        # nao estiver, para nao dar por bom um instalador que nao abre.
        #
        # Roda ANTES da publicacao (antes ficava depois): com o upload separado do
        # build, da para reprovar um pacote quebrado sem ter subido nada. Release
        # que nao presta nao chega nem a existir com assets.
        run: |
          echo "Procurando better_sqlite3.node em release/win-unpacked/resources..."
          found=$(find "apps/desktop/release/win-unpacked/resources" -name "better_sqlite3.node" 2>/dev/null || true)
          echo "Encontrado: ${found:-<nenhum>}"
          if [ -z "$found" ]; then
            echo "::error title=Nativo ausente::better_sqlite3.node NAO foi empacotado — o app nao abriria."
            echo "Todos os .node encontrados:"
            find "apps/desktop/release/win-unpacked/resources" -name "*.node" 2>/dev/null || true
            exit 1
          fi
          echo "OK: binario nativo presente no pacote."

      - name: Upload the release assets (exe + blockmap + build.yml)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Uma release sem o yml de metadados (ou sem o .exe/.blockmap) quebra o
        # electron-updater silenciosamente. Este passo garante o trio completo e
        # e idempotente: asset que ja existe com o mesmo nome e mantido.
        #
        # O yml sobe RENOMEADO para `build.yml`. O arquivo que o electron-builder
        # gera se chama sempre `latest.yml` — e tem que continuar assim, porque o
        # nome do canal no build tambem iria parar dentro do app (ver o cabecalho
        # deste arquivo). Aqui so o ASSET muda de nome, e para um nome que canal
        # nenhum segue.
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          DIR="apps/desktop/release"
          YML_ASSET="$BUILD_METADATA_ASSET"

          exe=$(find "$DIR" -maxdepth 1 -name "*.exe" -not -name "*uninstaller*" | head -n1)
          blockmap=$(find "$DIR" -maxdepth 1 -name "*.exe.blockmap" | head -n1)
          latest="$DIR/latest.yml"
          for f in "$exe" "$blockmap" "$latest"; do
            if [ -z "$f" ] || [ ! -f "$f" ]; then
              echo "::error title=Build incompleto::Arquivo de release ausente localmente (exe='$exe' blockmap='$blockmap' latest.yml existe=$([ -f "$latest" ] && echo sim || echo nao)). O dist:win:ci falhou antes de gerar o instalador."
              exit 1
            fi
          done

          release=$(curl -s -f \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          release_id=$(echo "$release" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).id))")
          existing=$(echo "$release" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>JSON.parse(s).assets.forEach(a=>console.log(a.name)))")
          echo "Assets ja presentes na release $TAG:"
          echo "${existing:-<nenhum>}"

          upload() {
            local file="$1" name="$2"
            if printf '%s\n' "$existing" | grep -qxF "$name"; then
              echo "OK: $name"
              return
            fi
            echo "Subindo asset: $name"
            curl -s -f -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/$REPO/releases/$release_id/assets?name=$name" > /dev/null
            echo "Enviado: $name"
          }

          for f in "$exe" "$blockmap"; do
            base=$(basename "$f")
            upload "$f" "${base// /-}" # electron-builder troca espacos por '-' no nome do asset
          done
          upload "$latest" "$YML_ASSET"

          echo "Release $TAG completa (exe + blockmap + $YML_ASSET)."

      - name: Summary
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## KyberRock Desktop $VERSION"
            echo ""
            echo "Build **parado**: publicado como pre-release com \`$BUILD_METADATA_ASSET\`."
            echo "Nenhuma balanca — nem a de teste — recebe esta versao sozinha."
            echo ""
            echo "Para distribuir, rode o workflow **Desktop promote** com a versao \`$VERSION\`:"
            echo ""
            echo "- \`target: beta\` → vai para as balancas marcadas como teste;"
            echo "- \`target: latest\` → libera para todas as balancas de producao."
          } >> "$GITHUB_STEP_SUMMARY"
